<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffd61f" />
    <meta http-equiv="refresh" content="8;url=https://saitama-workout.vercel.app/" />
    <link rel="canonical" href="https://saitama-workout.vercel.app/" />
    <title>싸이따마훈련소 · 주소 변경</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #ffd61f; color: #171717; font-family: system-ui, sans-serif; }
      main { width: min(100%, 460px); padding: 28px; border: 3px solid #171717; border-radius: 16px; background: white; box-shadow: 6px 6px 0 #171717; }
      h1 { font-size: 25px; margin: 0 0 20px; }
      p { line-height: 1.7; }
      a { display: block; padding: 16px; margin-top: 24px; background: #171717; color: white; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #e53935; outline-offset: 4px; }
      small { display: block; margin-top: 14px; color: #555; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>싸이따마훈련소</h1>
      <p>서비스 주소가 변경되었습니다.<br />같은 구글 계정으로 로그인하면 저장된 운동 기록과 캐릭터를 그대로 불러옵니다.</p>
      <p>홈 화면에 추가한 앱은 새 주소에서 다시 추가해 주세요.</p>
      <a href="https://saitama-workout.vercel.app/">새 주소로 이동</a>
      <small>8초 후 자동으로 이동합니다.</small>
    </main>
  </body>
</html>
